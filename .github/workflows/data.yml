name: Refresh venue data

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The script has no dependencies beyond Node itself, so nothing is installed here.
      - run: node scripts/fetch-venues.mjs
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- public/data/venues.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/venues.json
          git commit -m "data: refresh venues from OpenStreetMap"
          git push
